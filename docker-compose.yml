services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: solar
      MYSQL_USER: solar
      MYSQL_PASSWORD: solarpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: [ "3306:3306" ]
    volumes: [ mysql_data:/var/lib/mysql ]
    healthcheck:
      test: [ "CMD","mysqladmin","ping","-h","localhost","-prootpass" ]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/solar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: solar
      DB_PASSWORD: solarpass
      JWT_SECRET: local-only-change-this-long-jwt-secret-12345678901234567890
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@saumya.local
      PUBLIC_BASE_URL: http://localhost:3000
      SEED_DATA_ENABLED: "true"
      UPLOAD_DIR: /var/lib/saumya/uploads
      SERVICE_ATTACHMENT_DIR: /var/lib/saumya/private-service-attachments
    ports: [ "8080:8080" ]
    volumes:
      - solar_uploads:/var/lib/saumya/uploads
      - solar_private_service_attachments:/var/lib/saumya/private-service-attachments
    depends_on:
      mysql: { condition: service_healthy }
      mailpit: { condition: service_started }
  frontend:
    build: ./frontend
    ports: [ "3000:80" ]
    depends_on: [ backend ]
volumes: { mysql_data: { }, solar_uploads: { }, solar_private_service_attachments: { } }
