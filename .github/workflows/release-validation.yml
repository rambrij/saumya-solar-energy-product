name: Cleanup branch and release validation

concurrency:
  group: cleanup-release-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - cleanup/final-code-cleanup
  pull_request:
    branches:
      - main
      - cleanup/final-code-cleanup

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Scan repository asynchronous and scheduled execution boundaries
        run: |
          bash scripts/audit/scan-async-workers.sh | tee /tmp/phase2-async-worker-inventory.txt
      - name: Upload asynchronous worker inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase2-async-worker-inventory
          path: /tmp/phase2-async-worker-inventory.txt
          retention-days: 30
      - name: Scan legacy authorization and role-name checks
        run: |
          bash scripts/audit/scan-legacy-authz.sh | tee /tmp/phase2-legacy-authz-inventory.txt
      - name: Upload legacy authorization inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase2-legacy-authz-inventory
          path: /tmp/phase2-legacy-authz-inventory.txt
          retention-days: 30
      - name: Run backend security, tenant-context and messaging regression tests
        working-directory: backend
        run: >
          mvn --batch-mode --no-transfer-progress
          -Dtest=EndpointAuthenticationMatrixTest,FinanceServiceAssignedVisitScopeTest,TenantExecutionContextTest,TenantSchedulerConcurrencyIntegrationTest,NotificationServiceTest
          test
      - name: Compile and test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate complete runtime endpoint authorization evidence
        run: python3 scripts/audit/assert-endpoint-authorization-evidence.py backend/target/phase2-endpoint-evidence
      - name: Upload runtime endpoint authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-endpoint-authorization-evidence
          path: backend/target/phase2-endpoint-evidence/*.csv
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Component tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  mysql-migrations:
    name: Validate Flyway migrations on MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use MySQL client from the MySQL 8.4 service container
        shell: bash
        run: |
          MYSQL_CONTAINER="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$MYSQL_CONTAINER"
          echo "MYSQL_SERVICE_CONTAINER=$MYSQL_CONTAINER" >> "$GITHUB_ENV"
          cat > /usr/local/bin/mysql <<'MYSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i "$MYSQL_SERVICE_CONTAINER" mysql --default-character-set=utf8mb4 --local-infile=1 "$@"
          MYSQL_WRAPPER
          chmod +x /usr/local/bin/mysql
      - name: Restore the pre-cleanup migration chain for schema comparison
        run: |
          set -euo pipefail
          git fetch --no-tags origin audit/implementation-gap-analysis
          mkdir -p /tmp/pre-cleanup-source
          git archive origin/audit/implementation-gap-analysis backend/src/main/resources/db/migration | tar -x -C /tmp/pre-cleanup-source
          OLD_MIGRATIONS=/tmp/pre-cleanup-source/backend/src/main/resources/db/migration
          test "$(find "$OLD_MIGRATIONS" -maxdepth 1 -type f -name 'V*.sql' | wc -l)" = "14"
          echo "PASS: captured the fourteen-migration pre-cleanup Flyway chain."

      - name: Enforce one-baseline migration layout
        run: |
          set -euo pipefail
          MIGRATIONS=backend/src/main/resources/db/migration
          test "$(find "$MIGRATIONS" -maxdepth 1 -type f -name 'V*.sql' | wc -l)" = "1"
          test -f "$MIGRATIONS/V1__baseline.sql"
          test "$(grep -Eic '^[[:space:]]*CREATE[[:space:]]+TABLE[[:space:]]' "$MIGRATIONS/V1__baseline.sql")" = "84"
          echo "PASS: exactly one V1 baseline contains all 84 required table definitions."

      - name: Compare the old migration chain with the single baseline on MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -prootpass -e "SET GLOBAL log_bin_trust_function_creators = 1; CREATE DATABASE solar_old_chain; CREATE DATABASE solar_baseline_test"
          OLD_MIGRATIONS=/tmp/pre-cleanup-source/backend/src/main/resources/db/migration
          while IFS= read -r migration; do
            echo "Applying old migration $(basename "$migration")"
            mysql -h 127.0.0.1 -uroot -prootpass solar_old_chain < "$migration"
          done < <(find "$OLD_MIGRATIONS" -maxdepth 1 -type f -name 'V*.sql' | sort -V)
          mysql -h 127.0.0.1 -uroot -prootpass solar_baseline_test < backend/src/main/resources/db/migration/V1__baseline.sql
          mysqldump -h 127.0.0.1 -uroot -prootpass --no-data --no-tablespaces --skip-comments --skip-add-drop-table --skip-set-charset --skip-lock-tables --routines --triggers solar_old_chain | sed -E 's/AUTO_INCREMENT=[0-9]+/AUTO_INCREMENT=1/g' > /tmp/old-schema.sql
          mysqldump -h 127.0.0.1 -uroot -prootpass --no-data --no-tablespaces --skip-comments --skip-add-drop-table --skip-set-charset --skip-lock-tables --routines --triggers solar_baseline_test | sed -E 's/AUTO_INCREMENT=[0-9]+/AUTO_INCREMENT=1/g' > /tmp/baseline-schema.sql
          if diff -u /tmp/old-schema.sql /tmp/baseline-schema.sql > schema-diff.txt; then
            echo "PASS: old V1-V14 schema and the single baseline are identical." | tee schema-diff.txt
            echo "Schema difference count: 0"
          else
            cat schema-diff.txt
            echo "FAIL: schema equivalence check found differences."
            exit 1
          fi

      - name: Upload schema equivalence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-schema-equivalence
          path: schema-diff.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Emit tenant schema, FK and unique-index inventory from the baseline database
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_baseline_test < docs/PHASE_1_2_TENANT_SCHEMA_AUDIT.sql | tee /tmp/tenant-schema-audit.txt
      - name: Upload tenant schema inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-tenant-schema-inventory
          path: /tmp/tenant-schema-audit.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Assert baseline tenant schema NULL-row inventory
        run: |
          python3 scripts/audit/assert-tenant-schema-audit.py /tmp/tenant-schema-audit.txt
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_baseline_test -Nse "SELECT COUNT(*) FROM role WHERE tenant_id IS NULL AND name IN ('PLATFORM_SUPER_ADMIN','PLATFORM_SUPPORT','CUSTOMER')")" = "3"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_baseline_test -Nse "SELECT COUNT(*) FROM role WHERE tenant_id IS NULL AND name NOT IN ('PLATFORM_SUPER_ADMIN','PLATFORM_SUPPORT','CUSTOMER')")" = "0"
          echo "PASS: all three nullable global role rows are explicitly classified; no unexpected global roles."

  mysql-app-startup:
    name: Start Spring Boot against MySQL 8.4 and Mailpit
    runs-on: ubuntu-24.04
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: solar
          MYSQL_USER: solar
          MYSQL_PASSWORD: solarpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Configure disposable MySQL for application trigger tests
        shell: bash
        run: |
          MYSQL_CONTAINER="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$MYSQL_CONTAINER"
          docker exec "$MYSQL_CONTAINER" mysql --connect-timeout=15 --user=root --password=rootpass \
            -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Run concurrent SLA, warranty and integration scheduler tests on MySQL 8.4
        working-directory: backend
        env:
          PHASE2_MYSQL_IT_URL: jdbc:mysql://127.0.0.1:3306/solar_phase2_scheduler_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          PHASE2_MYSQL_IT_USER: root
          PHASE2_MYSQL_IT_PASSWORD: rootpass
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-for-hmac-sha256-signing-key
          CORS_ORIGINS: http://localhost:5173
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "CREATE DATABASE solar_phase2_scheduler_it"
          mvn --batch-mode --no-transfer-progress -Dtest=TenantSchedulerConcurrencyIntegrationTest test

      - name: Start application and verify health
        working-directory: backend
        env:
          # Match the repository's docker-compose.yml local development profile.
          # These credentials are disposable CI-only values, never production secrets.
          DB_URL: jdbc:mysql://127.0.0.1:3306/solar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: solar
          DB_PASSWORD: solarpass
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-for-hmac-sha256-signing-key
          CORS_ORIGINS: http://localhost:5173
          SPRING_MAIL_HOST: 127.0.0.1
          SPRING_MAIL_PORT: 1025
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: 'false'
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: 'false'
          MAILPIT_BASE_URL: http://127.0.0.1:8025
          SEED_DATA_ENABLED: 'true'
          PLATFORM_BOOTSTRAP_ENABLED: 'false'
          APP_AUTH_PLATFORM_MFA_ENABLED: 'false'
        run: |
          java -jar target/platform-2.0.0.jar > /tmp/saumya-backend.log 2>&1 &
          APP_PID=$!
          echo "$APP_PID" > /tmp/saumya-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Spring Boot started successfully with Flyway migrations and Hibernate schema validation on MySQL 8.4."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/saumya-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/saumya-backend.log
          exit 1
      - name: Execute tenant-integrity preflight against the clean baseline database
        run: |
          cleanup_preflight_routines() {
            mysql --connect-timeout=15 --host=127.0.0.1 --port=3306 --user=solar --password=solarpass solar \
              -e "DROP PROCEDURE IF EXISTS assert_phase2_catalogue_tenant_integrity; DROP PROCEDURE IF EXISTS assert_phase2_operational_tenant_integrity;" || true
          }
          trap cleanup_preflight_routines EXIT
          mysql --connect-timeout=15 --host=127.0.0.1 --port=3306 --user=solar --password=solarpass solar \
            < backend/src/test/resources/tenant-isolation-production-preflight.sql

      - name: Set up Node for browser security tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Start React frontend for browser security tests
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/saumya-frontend.log 2>&1 &
          echo $! > /tmp/saumya-frontend.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              echo "React frontend started for browser security tests."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/saumya-frontend.log
          exit 1
      - name: Run browser-level tenant filter tampering tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e
      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop React frontend
        if: always()
        run: |
          if [ -f /tmp/saumya-frontend.pid ]; then
            kill "$(cat /tmp/saumya-frontend.pid)" || true
          fi
      - name: Stop Spring Boot
        if: always()
        run: |
          if [ -f /tmp/saumya-backend.pid ]; then
            kill "$(cat /tmp/saumya-backend.pid)" || true
          fi
