      - name: Apply V54 employee role permission reconciliation
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V54__reconcile_employee_role_permissions.sql
      - name: Apply V55 strict permission reconciliation and platform support
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V55__strict_permission_reconciliation_and_platform_support.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role r JOIN role_permission rp ON rp.role_id=r.id JOIN permission p ON p.id=rp.permission_id WHERE r.tenant_id IS NULL AND r.name='PLATFORM_SUPPORT' AND p.code IN ('AUDIT_VIEW','TENANT_VIEW')")" = "2"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role r JOIN role_permission rp ON rp.role_id=r.id JOIN permission p ON p.id=rp.permission_id WHERE r.tenant_id IS NOT NULL AND p.code IN ('CATALOG_MANAGE','CATALOG_VIEW','DISCOUNT_POLICY_MANAGE','CUSTOMER_MANAGE','LEAD_MANAGE','SURVEY_MANAGE','QUOTATION_MANAGE','DISCOUNT_APPROVE','USER_MANAGE','INVENTORY_MANAGE','SERVICE_MANAGE','FINANCE_MANAGE')")" = "0"
      - name: Apply V56 remove platform permissions from tenant roles
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V56__remove_platform_permissions_from_tenant_roles.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role r JOIN role_permission rp ON rp.role_id=r.id JOIN permission p ON p.id=rp.permission_id WHERE r.tenant_id IS NOT NULL AND p.code IN ('PLATFORM_MANAGE','SUBSCRIPTION_MANAGE','TENANT_VIEW','TENANT_UPDATE')")" = "0"

      - name: Apply V57 tenant-aware catalogue foreign keys
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V57__tenant_aware_catalogue_foreign_keys.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='solar_migration_test' AND constraint_name IN ('fk_product_category_tenant','fk_package_item_package_tenant','fk_package_item_product_tenant')")" = "3"

          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < backend/src/test/resources/tenant-isolation-v57.sql

      - name: Apply V58 operational tenant-aware foreign keys
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V58__operational_tenant_composite_foreign_keys.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='solar_migration_test' AND constraint_name IN ('fk_sales_lead_enquiry_tenant','fk_customer_order_quote_tenant','fk_inventory_balance_product_tenant','fk_invoice_order_tenant','fk_service_comment_ticket_tenant','fk_warranty_claim_warranty_tenant')")" = "6"
      - name: Apply V59 platform audit permission repair
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V59__ensure_platform_audit_permission.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role_permission rp JOIN role r ON r.id=rp.role_id JOIN permission p ON p.id=rp.permission_id WHERE r.tenant_id IS NULL AND r.name='PLATFORM_SUPER_ADMIN' AND p.code='AUDIT_VIEW'")" = "1"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role_permission rp JOIN role r ON r.id=rp.role_id JOIN permission p ON p.id=rp.permission_id WHERE r.tenant_id IS NOT NULL AND r.name='VENDOR_ADMIN' AND p.code='BRANCH_MANAGE'")" = "1"
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < backend/src/test/resources/tenant-isolation-v58.sql

      - name: Apply V60 tenant-owned tenant_id NOT NULL enforcement
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V60__enforce_tenant_id_not_null_on_tenant_owned_tables.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='solar_migration_test' AND column_name='tenant_id' AND table_name IN ('customer_order','order_item','quotation','quotation_item','site_survey','lead_history','integration_webhook_event','idempotency_record') AND is_nullable='NO'")" = "8"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='solar_migration_test' AND column_name='tenant_id' AND table_name IN ('app_user','role','audit_event','notification_delivery') AND is_nullable='YES'")" = "4"

      - name: Apply V61 integration and approval permission catalogue
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V61__install_integration_and_approval_permissions.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM permission WHERE code IN ('INTEGRATION_MANAGE','APPROVAL_WORKFLOW_MANAGE')")" = "2"

      - name: Apply V62 notification delivery idempotency
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V62__notification_delivery_idempotency.sql

      - name: Apply V63 tenant-scoped export jobs
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V63__tenant_scoped_export_jobs.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solar_migration_test' AND table_name='export_job'")" = "1"

      - name: Compare historical migrations with consolidated baseline
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "CREATE DATABASE solar_baseline_test"
          mysql -h 127.0.0.1 -uroot -prootpass solar_baseline_test < backend/src/main/resources/db/migration/V1__baseline.sql
          mysqldump -h 127.0.0.1 -uroot -prootpass --no-data --skip-comments --skip-add-drop-table --skip-set-charset --skip-lock-tables solar_migration_test | sed -E 's/AUTO_INCREMENT=[0-9]+/AUTO_INCREMENT=1/g' > /tmp/historical-schema.sql
          mysqldump -h 127.0.0.1 -uroot -prootpass --no-data --skip-comments --skip-add-drop-table --skip-set-charset --skip-lock-tables solar_baseline_test | sed -E 's/AUTO_INCREMENT=[0-9]+/AUTO_INCREMENT=1/g' > /tmp/baseline-schema.sql
          if diff -u /tmp/historical-schema.sql /tmp/baseline-schema.sql > schema-diff.txt; then
            echo "Schema equivalence: identical" > schema-diff.txt
          else
            cat schema-diff.txt
            exit 1
          fi

      - name: Upload schema equivalence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-schema-equivalence
          path: schema-diff.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Emit read-only tenant schema, FK and unique-index inventory
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < docs/PHASE_1_2_TENANT_SCHEMA_AUDIT.sql | tee /tmp/tenant-schema-audit.txt
      - name: Upload tenant schema inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-2-tenant-schema-inventory
          path: /tmp/tenant-schema-audit.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Assert exact tenant schema NULL-row inventory
        run: |
          python3 scripts/audit/assert-tenant-schema-audit.py /tmp/tenant-schema-audit.txt
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role WHERE tenant_id IS NULL AND name IN ('PLATFORM_SUPER_ADMIN','PLATFORM_SUPPORT','CUSTOMER')")" = "3"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -Nse "SELECT COUNT(*) FROM role WHERE tenant_id IS NULL AND name NOT IN ('PLATFORM_SUPER_ADMIN','PLATFORM_SUPPORT','CUSTOMER')")" = "0"
          echo "PASS: all three nullable global role rows are explicitly classified; no unexpected global roles."

  mysql-app-startup:
    name: Start Spring Boot against MySQL 8.4 and Mailpit
    runs-on: ubuntu-24.04
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: solar
          MYSQL_USER: solar
          MYSQL_PASSWORD: solarpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Configure disposable MySQL for legacy trigger migrations
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql --connect-timeout=15 --host=127.0.0.1 --port=3306 --user=root --password=rootpass \
            -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Run concurrent SLA, warranty and integration scheduler tests on MySQL 8.4
        working-directory: backend
        env:
          PHASE2_MYSQL_IT_URL: jdbc:mysql://127.0.0.1:3306/solar_phase2_scheduler_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          PHASE2_MYSQL_IT_USER: root
          PHASE2_MYSQL_IT_PASSWORD: rootpass
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-for-hmac-sha256-signing-key
          CORS_ORIGINS: http://localhost:5173
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "CREATE DATABASE solar_phase2_scheduler_it"
          mvn --batch-mode --no-transfer-progress -Dtest=TenantSchedulerConcurrencyIntegrationTest test

      - name: Start application and verify health
        working-directory: backend
        env:
          # Match the repository's docker-compose.yml local development profile.
          # These credentials are disposable CI-only values, never production secrets.
          DB_URL: jdbc:mysql://127.0.0.1:3306/solar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: solar
          DB_PASSWORD: solarpass
          JWT_SECRET: ci-only-secret-with-at-least-sixty-four-characters-for-hmac-sha256-signing-key
          CORS_ORIGINS: http://localhost:5173
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: 1025
          MAIL_SMTP_AUTH: 'false'
          MAIL_SMTP_STARTTLS: 'false'
          SEED_DATA_ENABLED: 'true'
          PLATFORM_BOOTSTRAP_ENABLED: 'false'
          APP_AUTH_PLATFORM_MFA_ENABLED: 'false'
        run: |
          java -jar target/platform-2.0.0.jar > /tmp/saumya-backend.log 2>&1 &
          APP_PID=$!
          echo "$APP_PID" > /tmp/saumya-backend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Spring Boot started successfully with Flyway migrations and Hibernate schema validation on MySQL 8.4."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/saumya-backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/saumya-backend.log
          exit 1
      - name: Execute V57 and V58 integrity preflight against migrated MySQL CI database
        run: |
          cleanup_preflight_routines() {
            mysql --connect-timeout=15 --host=127.0.0.1 --port=3306 --user=solar --password=solarpass solar \
              -e "DROP PROCEDURE IF EXISTS assert_phase2_catalogue_tenant_integrity; DROP PROCEDURE IF EXISTS assert_phase2_operational_tenant_integrity;" || true
          }
          trap cleanup_preflight_routines EXIT
          mysql --connect-timeout=15 --host=127.0.0.1 --port=3306 --user=solar --password=solarpass solar \
            < backend/src/test/resources/tenant-isolation-production-preflight.sql

      - name: Set up Node for browser security tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start React frontend for browser security tests
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/saumya-frontend.log 2>&1 &
          echo $! > /tmp/saumya-frontend.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              echo "React frontend started for browser security tests."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/saumya-frontend.log
          exit 1
      - name: Run browser-level tenant filter tampering tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e
      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop React frontend
        if: always()
        run: |
          if [ -f /tmp/saumya-frontend.pid ]; then
            kill "$(cat /tmp/saumya-frontend.pid)" || true
          fi
      - name: Stop Spring Boot
        if: always()
        run: |
          if [ -f /tmp/saumya-backend.pid ]; then
            kill "$(cat /tmp/saumya-backend.pid)" || true
          fi
