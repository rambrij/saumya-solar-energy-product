name: Release 1-4 and Phase 2 tenant-isolation validation (final verification)

on:
  push:
    branches:
      - audit/phase-2-implementation-gap-analysis
      - audit/phase-3-implementation-gap-analysis
  pull_request:
    branches:
      - audit/phase-2-implementation-gap-analysis
      - audit/phase-3-implementation-gap-analysis

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Scan repository asynchronous and scheduled execution boundaries
        run: |
          bash scripts/audit/scan-async-workers.sh | tee /tmp/phase2-async-worker-inventory.txt
      - name: Upload asynchronous worker inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase2-async-worker-inventory
          path: /tmp/phase2-async-worker-inventory.txt
          retention-days: 30
      - name: Scan legacy authorization and role-name checks
        run: |
          bash scripts/audit/scan-legacy-authz.sh | tee /tmp/phase2-legacy-authz-inventory.txt
      - name: Upload legacy authorization inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase2-legacy-authz-inventory
          path: /tmp/phase2-legacy-authz-inventory.txt
          retention-days: 30
      - name: Run backend security, tenant-context and messaging regression tests
        working-directory: backend
        run: >
          mvn --batch-mode --no-transfer-progress
          -Dtest=EndpointAuthenticationMatrixTest,FinanceServiceAssignedVisitScopeTest,TenantExecutionContextTest,TenantSchedulerConcurrencyIntegrationTest,NotificationServiceTest
          test
      - name: Compile and test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate complete runtime endpoint authorization evidence
        run: python3 scripts/audit/assert-endpoint-authorization-evidence.py backend/target/phase2-endpoint-evidence
      - name: Upload runtime endpoint authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-endpoint-authorization-evidence
          path: backend/target/phase2-endpoint-evidence/*.csv
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Component tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  mysql-migrations:
    name: Validate Flyway migrations on MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Restore historical migrations for equivalence validation
        run: |
          mkdir -p /tmp/historical-source
          git archive 467dc8278e13902a39c51d1c9d8d8e588db98f57 backend/src/main/resources/db/migration | tar -x -C /tmp/historical-source
          test "$(find /tmp/historical-source/backend/src/main/resources/db/migration -maxdepth 1 -name 'V*.sql' | wc -l)" = "63"
      - name: Enforce clean-install baseline structure
        run: |
          BASELINE=backend/src/main/resources/db/migration/V1__baseline.sql
          test "$(find backend/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | wc -l)" = "3"
          test "$(grep -Eic '^[[:space:]]*CREATE[[:space:]]+TABLE[[:space:]]' "$BASELINE")" = "74"
          if grep -Eiq '^[[:space:]]*ALTER[[:space:]]+TABLE[[:space:]]|^[[:space:]]*CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX[[:space:]]' "$BASELINE"; then
            echo "Baseline must declare all columns and indexes inside CREATE TABLE statements."
            exit 1
          fi
          echo "PASS: one V1 baseline plus additive V2 and V3 migrations; baseline retains 74 table definitions."
      - name: Apply V1 schema
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "CREATE DATABASE solar_migration_test"
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V1__complete_release2.sql
      - name: Validate current V1 plus Phase 3 V2 and V3 migrations on clean MySQL 8.4 schema
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass -e "CREATE DATABASE phase3_clean_install"
          mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install < backend/src/main/resources/db/migration/V1__baseline.sql
          mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install < backend/src/main/resources/db/migration/V2__phase3_reservation_expiry.sql
          mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install < backend/src/main/resources/db/migration/V3__phase3_order_policy_and_tenant_lifecycle.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='phase3_clean_install' AND table_name='inventory_reservation' AND column_name IN ('expires_at','released_at','release_reason','pre_reservation_order_status','released_by')")" = "5"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='phase3_clean_install' AND table_name='tenant' AND column_name IN ('verified_at','verified_by','activated_at','activated_by','suspended_at','suspended_by','closed_at','closed_by','lifecycle_reason')")" = "9"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install -Nse "SELECT COUNT(*) FROM order_transition_policy WHERE tenant_id IS NULL")" = "36"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install -Nse "SELECT COUNT(*) FROM permission WHERE code='ORDER_POLICY_MANAGE'")" = "1"
          test "$(mysql -h 127.0.0.1 -uroot -prootpass phase3_clean_install -Nse "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='phase3_clean_install' AND trigger_name IN ('trg_order_status_history_no_update','trg_order_status_history_no_delete')")" = "2"

      - name: Verify additive V2 permission migration
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test -e "INSERT INTO tenant(id,name,slug,status) VALUES(UUID_TO_BIN(UUID()),'Migration tenant','migration-tenant','ACTIVE'); SET @tenant_id=(SELECT id FROM tenant WHERE slug='migration-tenant'); INSERT INTO role(id,tenant_id,name) VALUES(UUID_TO_BIN(UUID()),@tenant_id,'VENDOR_ADMIN');"
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V2__vendor_employee_management_permission.sql
          test "$(mysql -h 127.0.0.1 -uroot -prootpass -Nse "SELECT COUNT(*) FROM role_permission rp JOIN role r ON r.id=rp.role_id JOIN permission p ON p.id=rp.permission_id WHERE r.name='VENDOR_ADMIN' AND p.code='USER_MANAGE'" solar_migration_test)" = "1"
      - name: Apply V3 quotation decision audit migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V3__quotation_customer_decision_audit.sql
      - name: Apply V4 access-token revocation migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V4__user_access_token_version.sql
      - name: Apply V5 role and solar catalogue bootstrap
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V5__permission_role_and_catalog_bootstrap.sql
      - name: Apply V6 required product category migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V6__require_product_category.sql
      - name: Apply V7 catalogue read permission migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V7__catalogue_read_permission.sql
      - name: Apply V8 lead assignment history migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V8__lead_assignment_history.sql
      - name: Apply V9 tenant discount policy migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V9__tenant_discount_approval_policy.sql
      - name: Apply V10 global identity roles migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V10__global_identity_roles.sql
      - name: Apply V11 Release 3 operations migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V11__release3_operations.sql
      - name: Apply V12 installation teams and ledger migration
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V12__installation_teams_checklist_templates_and_inventory_dimensions.sql
      - name: Apply V13 technician and service manager roles
        run: mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V13__technician_and_service_manager_roles.sql
      - name: Apply V14 order tax snapshot and immutable inventory ledger
