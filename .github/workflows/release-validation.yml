      - name: Apply idempotent V15 tax snapshot column migration twice
        run: |
          mysql -h 127.0.0.1 -uroot -prootpass solar_migration_test < /tmp/historical-source/backend/src/main/resources/db/migration/V15__ensure_order_tax_snapshot_column.sql
