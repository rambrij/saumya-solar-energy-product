name: Security checks
on:
  push:
    branches: [main, audit/implementation-gap-analysis]
  pull_request:
    branches: [main, audit/implementation-gap-analysis]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Focused security regression tests
        working-directory: backend
        run: >
          mvn --batch-mode --no-transfer-progress
          -Dtest=EndpointAuthenticationMatrixTest,Release2SecurityTest,Release12TenantIntegrationTest,TenantExecutionContextTest,AuthenticationRateLimitConcurrencyIntegrationTest
          test
