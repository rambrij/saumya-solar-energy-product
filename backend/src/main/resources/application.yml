server: { port: 8080 }
spring:
  datasource: { url: "${DB_URL}", username: "${DB_USER}", password: "${DB_PASSWORD}" }
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  flyway: { enabled: true }
  mail:
    host: mailpit
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management.endpoints.web.exposure.include: health,info
app:
  jwt-secret: "${JWT_SECRET}"
  cors-origins: "${CORS_ORIGINS}"
  security:
    trusted-proxies: ${TRUSTED_PROXY_IPS:}
  payment:
    webhook-secret: "${PAYMENT_WEBHOOK_SECRET:}"
  service:
    sla-check-interval-ms: ${SERVICE_SLA_CHECK_INTERVAL_MS:60000}
    attachment-location: ${SERVICE_ATTACHMENT_DIR:./data/private-service-attachments}
  survey:
    attachment-location: ${SURVEY_ATTACHMENT_DIR:./data/private-survey-attachments}
  warranty:
    attachment-location: ${WARRANTY_ATTACHMENT_DIR:./data/private-warranty-attachments}
  exports:
    location: ${EXPORT_DIR:./data/private-exports}
    retention-hours: ${EXPORT_RETENTION_HOURS:24}
    recovery-interval-ms: ${EXPORT_RECOVERY_INTERVAL_MS:60000}
    processing-lease-seconds: ${EXPORT_PROCESSING_LEASE_SECONDS:1800}
  storage:
    location: ${UPLOAD_DIR:./data/uploads}
    public-base-url: ${PUBLIC_BASE_URL:}
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
  bootstrap:
    platform-admin:
      enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
      email: ${PLATFORM_BOOTSTRAP_EMAIL:}
      password: ${PLATFORM_BOOTSTRAP_PASSWORD:}
  auth:
    platform-mfa-enabled: ${PLATFORM_MFA_ENABLED:true}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:None}
    refresh-cookie-domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}
    lockout:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    rate-limit:
      login-per-window: ${AUTH_LOGIN_RATE_LIMIT:10}
      recovery-per-window: ${AUTH_RECOVERY_RATE_LIMIT:5}
      mfa-per-window: ${AUTH_MFA_RATE_LIMIT:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      cleanup-cron: ${AUTH_RATE_LIMIT_CLEANUP_CRON:0 17 3 * * *}
  mailpit:
    base-url: ${MAILPIT_BASE_URL:http://mailpit:8025}
  mail:
    from: ${MAIL_FROM:no-reply@saumya.local}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  messaging:
    provider: ${NOTIFICATION_MESSAGING_PROVIDER:mock}
    mock:
      enabled: false
      webhook-secret: ${MOCK_NOTIFICATION_WEBHOOK_SECRET:local-mock-notification-secret-change-me}
    outbox-interval-ms: ${NOTIFICATION_OUTBOX_INTERVAL_MS:15000}
