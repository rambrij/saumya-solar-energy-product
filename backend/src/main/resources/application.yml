server: { port: 8080 }
spring:
  datasource: { url: "${DB_URL}", username: "${DB_USER}", password: "${DB_PASSWORD}" }
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  flyway: { enabled: true }
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management.endpoints.web.exposure.include: health,info
app:
  jwt-secret: "${JWT_SECRET}"
  cors-origins: "${CORS_ORIGINS}"
  payment:
    webhook-secret: "${PAYMENT_WEBHOOK_SECRET:}"
  service:
    sla-check-interval-ms: ${SERVICE_SLA_CHECK_INTERVAL_MS:60000}
    attachment-location: ${SERVICE_ATTACHMENT_DIR:./data/private-service-attachments}
  survey:
    attachment-location: ${SURVEY_ATTACHMENT_DIR:./data/private-survey-attachments}
  warranty:
    attachment-location: ${WARRANTY_ATTACHMENT_DIR:./data/private-warranty-attachments}
  storage:
    location: ${UPLOAD_DIR:./data/uploads}
    public-base-url: ${PUBLIC_BASE_URL:}
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
  bootstrap:
    platform-admin:
      enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
      email: ${PLATFORM_BOOTSTRAP_EMAIL:}
      password: ${PLATFORM_BOOTSTRAP_PASSWORD:}
  auth:
    platform-mfa-enabled: ${PLATFORM_MFA_ENABLED:true}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    lockout:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
    rate-limit:
      login-per-window: ${AUTH_LOGIN_RATE_LIMIT:10}
      recovery-per-window: ${AUTH_RECOVERY_RATE_LIMIT:5}
      mfa-per-window: ${AUTH_MFA_RATE_LIMIT:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  mail:
    from: ${MAIL_FROM:no-reply@saumya.local}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  messaging:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
